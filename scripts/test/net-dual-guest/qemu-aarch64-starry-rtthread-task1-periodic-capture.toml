# Task 1 RT-Thread periodic evidence capture. Same machine as the shared-CPU
# Task 1 A/B but with dedicated serial/QMP socket names so the periodic
# experiment can run without colliding with other evidence runs.
args = [
  "-display", "none",
  "-monitor", "none",
  "-serial", "unix:@SERIAL_SOCKET@,server",
  "-cpu", "cortex-a72",
  "-machine", "virt,virtualization=on,gic-version=3",
  "-smp", "2",
  "-m", "8g",
  "-device", "nvme,drive=disk0,serial=tgoskits,max_ioqpairs=64,msix_qsize=1",
  "-drive", "id=disk0,if=none,format=raw,file=@ROOTFS@",
  "-append", "root=/dev/nvme0n1 rw init=/init",
  "-qmp", "unix:@QMP_SOCKET@,server,nowait",
]
fail_regex = ["TASK2_ERROR=", "(?i)panic"]
success_regex = ["NEVER_MATCH_EVIDENCE_CAPTURE"]
timeout = 180
to_bin = true
uefi = false
