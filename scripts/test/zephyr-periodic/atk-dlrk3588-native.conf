# Vendor U-Boot enters Zephyr through EL2. Clean and disable any inherited
# data-cache state before Zephyr installs its own EL1 translation tables.
CONFIG_ARM64_DCACHE_ALL_OPS=y
CONFIG_ARM64_BOOT_DISABLE_DCACHE=y

# RK3588's DesignWare UART exposes registers on 32-bit boundaries and does
# not support the byte accesses used by the generic ns16550 default. The
# sibling RK3588S Zephyr SoC selects the same requirement in Kconfig.
CONFIG_UART_NS16550_ACCESS_WORD_ONLY=y

# Leave headroom for the image, GIC, UART, and runtime device mappings.
CONFIG_MAX_XLAT_TABLES=32
